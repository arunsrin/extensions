<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TimeLedger</title>
  <link rel="stylesheet" href="../shared/styles.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-shell">
    <header class="popup-header">
      <div class="brand">
        <img src="../../icons/icon32.png" alt="TimeLedger" width="20" height="20" />
        <span class="brand-name">TimeLedger</span>
      </div>
      <div class="header-actions">
        <span id="status-pill" class="status-pill">Checking...</span>
        <button id="toggle-pause-btn" class="btn btn-sm" type="button">Pause</button>
      </div>
    </header>

    <section class="hero-card">
      <div class="hero-top">
        <div>
          <div class="hero-label" id="range-label">Today's Active Time</div>
          <div class="hero-value mono" id="total-time">0s</div>
        </div>
        <div class="range-switch" role="tablist" aria-label="Range">
          <button type="button" role="tab" aria-selected="true" class="range-btn active" data-range="today">Today</button>
          <button type="button" role="tab" aria-selected="false" class="range-btn" data-range="7d">7 Days</button>
        </div>
      </div>
      <div class="hero-meta">
        <span id="sites-count">0 sites</span>
        <span>•</span>
        <span id="pages-count">0 pages</span>
        <button id="ignore-active-btn" class="link-btn hidden" type="button" title="Stop tracking the current site">Ignore current site</button>
      </div>
    </section>

    <div class="view-tabs">
      <button type="button" class="view-tab active" data-tab="sites">Top Websites</button>
      <button type="button" class="view-tab" data-tab="pages">Top Pages</button>
    </div>

    <main class="list-container">
      <div id="sites-list" class="item-list"></div>
      <div id="pages-list" class="item-list hidden"></div>
    </main>

    <footer class="popup-footer">
      <span class="privacy-note" title="All browsing data stays strictly in local browser storage">Local-only storage</span>
      <div class="footer-buttons">
        <button id="open-settings-btn" class="btn btn-sm" type="button">Settings</button>
        <button id="open-dashboard-btn" class="btn btn-primary btn-sm" type="button">Full Dashboard →</button>
      </div>
    </footer>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
